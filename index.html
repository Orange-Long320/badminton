<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍羽毛球排行榜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 左侧导航栏 -->
    <nav class="sidebar">
        <div class="nav-brand">
            <div class="logo">BYC</div>
            <span class="logo-text">Badminton</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" title="排行榜">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9H2v10c0 1.1.9 2 2 2h16a2 2 0 002-2V9h-4"/>
                    <polyline points="4 2 4 7 9 7 9 2"/>
                    <rect x="14" y="2" width="8" height="5"/>
                </svg>
            </li>
            <li class="nav-item" title="选手">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </li>
            <li class="nav-item" title="文件夹">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                </svg>
            </li>
        </ul>
        <div class="nav-bottom">
            <li class="nav-item add-btn" title="新建对局">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </li>
            <div class="nav-user">
                <div class="user-avatar">龙</div>
                <span class="user-name">龙鑫昊</span>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>羽毛球排行榜</h1>
                <p class="subtitle">宿舍联赛 · 2026 赛季</p>
            </div>
        </header>

        <div class="dashboard-layout">
            <!-- 左侧主要区域 -->
            <div class="dashboard-main">
                <div class="dashboard-grid">
                    <!-- 单打排行榜 -->
                    <section class="card singles-leaderboard">
                        <div class="card-header">
                            <h2>
                                <svg class="nav-icon" style="width:18px;height:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="8" r="7"/>
                                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
                                </svg>
                                单打排行榜
                            </h2>
                            <span class="badge">Singles</span>
                        </div>
                        <div class="card-content">
                            <table class="leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>选手</th>
                                        <th>积分</th>
                                    </tr>
                                </thead>
                                <tbody id="singles-body">
                                    <!-- 数据由 JS 动态生成 -->
                                </tbody>
                            </table>
                            <div class="table-click-hint">点击选手名字查看详情</div>
                        </div>
                    </section>

                    <!-- 双打排行榜 -->
                    <section class="card doubles-leaderboard">
                        <div class="card-header">
                            <h2>
                                <svg class="nav-icon" style="width:18px;height:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 010 7.75"/>
                                </svg>
                                双打排行榜
                            </h2>
                            <span class="badge">Doubles</span>
                        </div>
                        <div class="card-content">
                            <table class="leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>组合</th>
                                        <th>积分</th>
                                    </tr>
                                </thead>
                                <tbody id="doubles-body">
                                    <!-- 数据由 JS 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- 选手资料 -->
                    <section class="card player-profiles">
                        <div class="card-header">
                            <h2>
                                <svg class="nav-icon" style="width:18px;height:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                选手资料
                            </h2>
                            <span class="badge">Players</span>
                        </div>
                        <div class="card-content">
                            <div class="player-carousel">
                                <button class="carousel-btn prev-btn" id="prev-player" title="上一个">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="15 18 9 12 15 6"/>
                                    </svg>
                                </button>
                                <div class="player-card" id="player-card">
                                    <!-- 选手卡片由 JS 动态生成 -->
                                </div>
                                <button class="carousel-btn next-btn" id="next-player" title="下一个">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="9 18 15 12 9 6"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="player-card-actions">
                                <button class="btn-view-profile" id="btn-view-profile" title="查看详细资料">
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                    查看详细资料
                                </button>
                            </div>
                            <div class="carousel-dots" id="carousel-dots">
                                <!-- 指示点由 JS 动态生成 -->
                            </div>
                        </div>
                    </section>

                    <!-- 比赛记录（只读） -->
                    <section class="card record-match">
                        <div class="card-header">
                            <h2>
                                <svg class="nav-icon" style="width:18px;height:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="12" y1="18" x2="12" y2="12"/>
                                    <line x1="9" y1="15" x2="15" y2="15"/>
                                </svg>
                                比赛记录
                            </h2>
                            <span class="badge">Match History</span>
                        </div>
                        <div class="card-content">
                            <div class="recent-matches" id="recent-matches">
                                <h3>最近比赛</h3>
                                <div class="match-list">
                                    <!-- 比赛记录由 JS 动态生成 -->
                                </div>
                            </div>
                            <div style="text-align: center; margin-top: 20px; padding: 20px; background: var(--color-surface-alt); border-radius: var(--radius-sm);">
                                <p style="color: var(--color-text-secondary); margin-bottom: 12px;">需要录入新比赛？</p>
                                <a href="admin.html" class="btn btn-primary">
                                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                    进入管理后台
                                </a>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <!-- 右侧边栏 - 日历 -->
            <aside class="dashboard-sidebar">
                <!-- 羽毛球日历 -->
                <section class="card calendar-card">
                    <div class="card-header">
                        <h2>
                            <svg class="nav-icon" style="width:18px;height:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            羽毛球日历
                        </h2>
                        <div class="calendar-controls">
                            <button class="calendar-nav-btn" id="prev-month" title="上个月">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"/>
                                </svg>
                            </button>
                            <span class="current-month" id="current-month"></span>
                            <button class="calendar-nav-btn" id="next-month" title="下个月">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-content calendar-content">
                        <div class="calendar-weekdays">
                            <span class="weekday">日</span>
                            <span class="weekday">一</span>
                            <span class="weekday">二</span>
                            <span class="weekday">三</span>
                            <span class="weekday">四</span>
                            <span class="weekday">五</span>
                            <span class="weekday">六</span>
                        </div>
                        <div class="calendar-days" id="calendar-days">
                            <!-- 日期由 JS 动态生成 -->
                        </div>
                        <div class="calendar-legend">
                            <div class="legend-item">
                                <span class="legend-dot current"></span>
                                <span class="legend-label">今天</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-dot match-day"></span>
                                <span class="legend-label">比赛日</span>
                            </div>
                        </div>
                    </div>
                </section>
            </aside>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
