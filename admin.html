<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 宿舍羽毛球排行榜</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .admin-section {
            background: var(--color-surface);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-md);
        }
        .admin-section h2 {
            margin-top: 0;
            color: var(--color-text-primary);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            transition: all var(--transition-fast);
        }
        .btn-primary {
            background: var(--color-dark);
            color: white;
        }
        .btn-primary:hover {
            background: var(--color-dark-surface);
        }
        .btn-danger {
            background: var(--color-danger);
            color: white;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: var(--color-surface-alt);
            color: var(--color-text-primary);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: end;
        }
        .form-row .form-group {
            margin-bottom: 0;
        }
        input[type="text"],
        input[type="number"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--color-surface-alt);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: border-color var(--transition-fast);
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--color-dark);
        }
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--color-text-secondary);
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: var(--spacing-md);
            border: 2px solid var(--color-surface-alt);
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: var(--color-dark);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        .stat-card {
            background: var(--color-surface-alt);
            padding: var(--spacing-md);
            border-radius: var(--radius-sm);
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-dark);
        }
        .stat-label {
            font-size: 12px;
            color: var(--color-text-secondary);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--color-success);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }
        .toast.error {
            background: var(--color-danger);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 密码保护覆盖层 */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            background: var(--color-surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 100%;
        }
        .auth-box h2 {
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-box p {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
        }
        .match-list-preview {
            max-height: 300px;
            overflow-y: auto;
        }
        .match-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--color-surface-alt);
        }
        .match-item:last-child {
            border-bottom: none;
        }
        .match-teams {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .match-score {
            font-weight: bold;
            color: var(--color-dark);
            min-width: 60px;
            text-align: center;
        }
        .btn-delete {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .btn-delete:hover {
            color: var(--color-danger);
        }
        .btn-delete svg {
            width: 18px;
            height: 18px;
        }
        .hidden {
            display: none !important;
        }
        .admin-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .admin-nav button {
            padding: 8px 16px;
            background: var(--color-surface);
            border: 2px solid var(--color-surface-alt);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-fast);
        }
        .admin-nav button.active {
            background: var(--color-dark);
            color: white;
            border-color: var(--color-dark);
        }
    </style>
</head>
<body>
    <!-- 密码验证覆盖层 -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-box">
            <h2>🔐 管理员登录</h2>
            <p>请输入管理密码以访问后台</p>
            <form id="auth-form">
                <div class="form-group">
                    <input type="password" id="admin-password" placeholder="请输入密码" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">
                    登录
                </button>
            </form>
            <p style="margin-top: 16px; font-size: 13px;">
                <a href="index.html" style="color: var(--color-text-secondary);">← 返回首页</a>
            </p>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content hidden" id="main-content">
        <nav class="sidebar">
            <div class="nav-brand">
                <div class="logo">BYC</div>
                <span class="logo-text">Badminton</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item" title="返回首页" onclick="location.href='index.html'">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </li>
            </ul>
        </nav>

        <div class="admin-container">
            <h1 style="margin-bottom: 24px;">🏸 管理后台</h1>

            <!-- 导航 -->
            <div class="admin-nav">
                <button class="active" data-tab="record">📝 录入比赛</button>
                <button data-tab="players">👤 选手管理</button>
                <button data-tab="manage">📊 数据管理</button>
                <button data-tab="matches">📅 比赛列表</button>
            </div>

            <!-- 录入比赛 -->
            <div class="admin-section" id="tab-record">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    录入比赛
                </h2>

                <form id="match-form" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="match-date">比赛日期</label>
                        <input type="date" id="match-date" required>
                    </div>

                    <div class="form-group">
                        <label>比赛类型</label>
                        <div style="display: flex; gap: 12px;">
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="radio" name="match-type" value="singles" checked onchange="toggleMatchType()"> 单打
                            </label>
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="radio" name="match-type" value="doubles" onchange="toggleMatchType()"> 双打
                            </label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="team1-player1">选手 1</label>
                            <select id="team1-player1" required></select>
                        </div>
                        <div class="form-group">
                            <label for="team1-score" style="text-align: center;">得分</label>
                            <input type="number" id="team1-score" placeholder="0" min="0" style="width: 80px;" required>
                        </div>
                        <div class="form-group">
                            <label for="team2-player1">对手 1</label>
                            <select id="team2-player1" required></select>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 12px;">
                        <div class="form-group"></div>
                        <div class="form-group">
                            <label for="team2-score" style="text-align: center;">得分</label>
                            <input type="number" id="team2-score" placeholder="0" min="0" style="width: 80px;" required>
                        </div>
                        <div class="form-group"></div>
                    </div>

                    <div id="doubles-fields" class="hidden">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="team1-player2">选手 2 (队友)</label>
                                <select id="team1-player2"></select>
                            </div>
                            <div class="form-group"></div>
                            <div class="form-group">
                                <label for="team2-player2">对手 2 (队友)</label>
                                <select id="team2-player2"></select>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            提交记录
                        </button>
                    </div>
                </form>
            </div>

            <!-- 选手管理 -->
            <div class="admin-section hidden" id="tab-players">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    选手管理
                </h2>

                <!-- 添加/编辑选手表单 -->
                <div style="background: var(--color-bg); padding: var(--spacing-lg); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg);">
                    <h3 style="margin-bottom: 16px;" id="player-form-title">➕ 添加新选手</h3>

                    <form id="player-form">
                        <input type="hidden" id="edit-player-id">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="player-name">姓名</label>
                                <input type="text" id="player-name" placeholder="输入姓名" required style="width: 100%;">
                            </div>
                            <div class="form-group">
                                <label for="player-signature">签名/垃圾话</label>
                                <input type="text" id="player-signature" placeholder="例如：羽球狂人" style="width: 100%;">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="player-avatar-type">头像类型</label>
                                <select id="player-avatar-type" style="width: 100%;">
                                    <option value="text">文字头像</option>
                                    <option value="upload">上传图片</option>
                                </select>
                            </div>
                            <div class="form-group" id="text-avatar-group">
                                <label for="player-avatar">文字头像（1-2 个字）</label>
                                <input type="text" id="player-avatar" placeholder="例如：龙" maxlength="2" style="width: 100%;">
                            </div>
                            <div class="form-group hidden" id="upload-avatar-group">
                                <label for="player-avatar-upload">上传头像图片</label>
                                <input type="file" id="player-avatar-upload" accept="image/*" style="width: 100%;">
                                <div id="avatar-preview" style="margin-top: 8px;"></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="player-play-type">擅长类型</label>
                                <select id="player-play-type" style="width: 100%;">
                                    <option value="both">单打/双打</option>
                                    <option value="singles">只打单打</option>
                                    <option value="doubles">只打双打</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                <span id="player-form-submit-text">添加选手</span>
                            </button>
                            <button type="button" class="btn btn-secondary" id="cancel-edit-player" style="margin-left: 12px;">取消</button>
                        </div>
                    </form>
                </div>

                <!-- 选手列表 -->
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;" id="players-list">
                    <!-- 选手卡片由 JS 渲染 -->
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="admin-section hidden" id="tab-manage">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    数据管理
                </h2>

                <div class="stats-grid" style="margin-top: 20px;">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-players">0</div>
                        <div class="stat-label">选手数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-doubles">0</div>
                        <div class="stat-label">双打组合</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-matches">0</div>
                        <div class="stat-label">比赛记录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-storage">0 KB</div>
                        <div class="stat-label">存储空间</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>导出数据</label>
                    <textarea id="export-data" readonly placeholder="点击"导出全部数据"按钮生成数据..."></textarea>
                </div>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="exportData()">导出全部数据</button>
                    <button class="btn btn-secondary" onclick="copyExport()">复制</button>
                    <button class="btn btn-secondary" onclick="downloadExport()">下载</button>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>导入数据</label>
                    <textarea id="import-data" placeholder="在此粘贴 JSON 格式的数据..."></textarea>
                </div>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="importData()">导入数据</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('import-data').value = ''">清空</button>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label style="color: var(--color-danger);">⚠️ 危险操作</label>
                    <button class="btn btn-danger" onclick="resetData()">清除所有数据</button>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label style="color: var(--color-success);">☁️ 云端同步</label>
                    <p style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px;">
                        通过 GitHub API 直接更新仓库中的 data.json 文件，自动提交推送。
                    </p>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 13px;">GitHub Token</label>
                        <input type="password" id="github-token" placeholder="输入 GitHub Personal Access Token" style="width: 100%; padding: 10px; border: 1px solid var(--color-surface-alt); border-radius: var(--radius-sm);">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 13px;">仓库 Owner</label>
                        <input type="text" id="github-owner" placeholder="例如：Orange-Long320" value="Orange-Long320" style="width: 100%; padding: 10px; border: 1px solid var(--color-surface-alt); border-radius: var(--radius-sm);">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 13px;">仓库名称</label>
                        <input type="text" id="github-repo" placeholder="例如：badminton" value="badminton" style="width: 100%; padding: 10px; border: 1px solid var(--color-surface-alt); border-radius: var(--radius-sm);">
                    </div>
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 13px;">分支名称</label>
                        <input type="text" id="github-branch" placeholder="例如：gh-pages" value="gh-pages" style="width: 100%; padding: 10px; border: 1px solid var(--color-surface-alt); border-radius: var(--radius-sm);">
                    </div>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
                        <button class="btn btn-primary" onclick="saveGithubConfig()">保存配置</button>
                        <button class="btn btn-primary" onclick="syncToGithub()">🚀 同步到 GitHub</button>
                    </div>
                    <p style="font-size: 12px; color: var(--color-text-muted);">
                        💡 获取 Token：访问 <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--color-primary);">GitHub Token 设置页</a> → 创建新 Token（勾选 repo 权限）
                    </p>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label style="color: var(--color-success);">📤 同步到 GitHub</label>
                    <p style="font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px;">
                        生成 data.json 文件后，手动提交到 GitHub 仓库，其他人就能看到最新数据了。
                    </p>
                    <button class="btn btn-primary" onclick="generateDataJson()">生成 data.json</button>
                </div>
            </div>

            <!-- 比赛列表 -->
            <div class="admin-section hidden" id="tab-matches">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    比赛列表
                </h2>
                <div class="match-list-preview" id="match-list" style="margin-top: 20px;">
                    <!-- 比赛列表由 JS 渲染 -->
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // 密码配置（请修改为你的密码）
        const ADMIN_PASSWORD = 'admin123';

        // 检查登录状态
        function checkAuth() {
            const isAuth = sessionStorage.getItem('admin_authenticated');
            if (isAuth === 'true') {
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                initAdmin();
            }
        }

        // 密码验证
        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('admin_authenticated', 'true');
                document.getElementById('auth-overlay').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                initAdmin();
                showToast('登录成功');
            } else {
                showToast('密码错误', 'error');
            }
        });

        // 切换比赛类型
        function toggleMatchType() {
            const type = document.querySelector('input[name="match-type"]:checked').value;
            const doublesFields = document.getElementById('doubles-fields');
            if (type === 'doubles') {
                doublesFields.classList.remove('hidden');
            } else {
                doublesFields.classList.add('hidden');
            }
        }

        // 初始化管理后台
        function initAdmin() {
            // 管理后台从 localStorage 加载数据
            const savedPlayers = localStorage.getItem('badminton_players');
            const savedDoubles = localStorage.getItem('badminton_doubles');
            const savedMatches = localStorage.getItem('badminton_matches');
            const savedNextId = localStorage.getItem('badminton_nextPlayerId');

            if (savedPlayers) players = JSON.parse(savedPlayers);
            if (savedDoubles) doublesTeams = JSON.parse(savedDoubles);
            if (savedMatches) matchHistory = JSON.parse(savedMatches);
            if (savedNextId) window.nextPlayerId = parseInt(savedNextId);

            loadStats();
            populatePlayerSelects();
            renderMatchList();
            renderPlayersList(); // 渲染选手列表

            // 设置默认日期为今天
            document.getElementById('match-date').value = new Date().toISOString().split('T')[0];
        }

        // ================================
        // 选手管理功能
        // ================================

        // 渲染选手列表
        function renderPlayersList() {
            const container = document.getElementById('players-list');
            if (!container) return;

                            <button class="btn btn-danger" onclick="deletePlayer(${player.id})" style="flex:1;font-size:13px;padding:6px;">删除</button>

        // 头像类型切换

                const textGroup = document.getElementById('text-avatar-group');

                        textGroup.classList.add('hidden');
                        uploadGroup.classList.remove('hidden');

                        uploadGroup.classList.add('hidden');

                const file = e.target.files[0];

        // 取消编辑按钮

        // 选手表单提交

                e.preventDefault();

                const editId = document.getElementById('edit-player-id').value;
                const name = document.getElementById('player-name').value.trim();
                const signature = document.getElementById('player-signature').value.trim();

                    const preview = document.getElementById('avatar-preview');

        // 填充选手选择框
        function populatePlayerSelects() {
            const selects = ['team1-player1', 'team1-player2', 'team2-player1', 'team2-player2'];
            const options = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            selects.forEach(id => {
                const select = document.getElementById(id);
                if (select) select.innerHTML = options;
            });
        }

        // 编辑选手
        function editPlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            document.getElementById('edit-player-id').value = player.id;
            document.getElementById('player-name').value = player.name;
            document.getElementById('player-signature').value = player.signature || '';
            document.getElementById('player-play-type').value = player.play_type || 'both';

            // 设置头像
            if (player.avatar && player.avatar.startsWith('data:')) {
                const avatarType = document.getElementById('player-avatar-type');
                if (avatarType) avatarType.value = 'upload';
                const textGroup = document.getElementById('text-avatar-group');
                const uploadGroup = document.getElementById('upload-avatar-group');
                if (textGroup) textGroup.classList.add('hidden');
                if (uploadGroup) uploadGroup.classList.remove('hidden');
                const preview = document.getElementById('avatar-preview');
                if (preview) {
                    preview.innerHTML = `<img src="${player.avatar}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">`;
                    preview.dataset.avatarData = player.avatar;
                }
            } else {
                const avatarType = document.getElementById('player-avatar-type');
                if (avatarType) avatarType.value = 'text';
                const textGroup = document.getElementById('text-avatar-group');
                const uploadGroup = document.getElementById('upload-avatar-group');
                if (textGroup) textGroup.classList.remove('hidden');
                if (uploadGroup) uploadGroup.classList.add('hidden');
                const avatarInput = document.getElementById('player-avatar');
                if (avatarInput) avatarInput.value = player.avatar || '';
            }

            const title = document.getElementById('player-form-title');
            const submitText = document.getElementById('player-form-submit-text');
            if (title) title.textContent = '✏️ 编辑选手';
            if (submitText) submitText.textContent = '保存修改';
        }

        // 重置表单
        function resetPlayerForm() {
            const editId = document.getElementById('edit-player-id');
            const name = document.getElementById('player-name');
            const signature = document.getElementById('player-signature');
            const avatar = document.getElementById('player-avatar');
            const avatarUpload = document.getElementById('player-avatar-upload');
            const playType = document.getElementById('player-play-type');
            const preview = document.getElementById('avatar-preview');
            const textGroup = document.getElementById('text-avatar-group');
            const uploadGroup = document.getElementById('upload-avatar-group');
            const avatarType = document.getElementById('player-avatar-type');
            const title = document.getElementById('player-form-title');
            const submitText = document.getElementById('player-form-submit-text');

            if (editId) editId.value = '';
            if (name) name.value = '';
            if (signature) signature.value = '';
            if (avatar) avatar.value = '';
            if (avatarUpload) avatarUpload.value = '';
            if (playType) playType.value = 'both';
            if (preview) {
                preview.innerHTML = '';
                if (preview.dataset) delete preview.dataset.avatarData;
            }
            if (textGroup) textGroup.classList.remove('hidden');
            if (uploadGroup) uploadGroup.classList.add('hidden');
            if (avatarType) avatarType.value = 'text';
            if (title) title.textContent = '➕ 添加新选手';
            if (submitText) submitText.textContent = '添加选手';
        }

        // 删除选手
        function deletePlayer(playerId) {
            if (!confirm('确定要删除这名选手吗？相关的比赛记录也会被删除。')) return;

            const index = players.findIndex(p => p.id === playerId);
            if (index === -1) return;
            const playerName = players[index].name;

            // 删除相关比赛
            matchHistory = matchHistory.filter(m => {
                if (m.type === 'singles') {
                    return m.team1 !== playerName && m.team2 !== playerName;
                } else {
                    return !m.team1.includes(playerName) && !m.team2.includes(playerName);
                }
            });

            // 删除双打组合
            doublesTeams = doublesTeams.filter(t => !t.players.includes(playerId));

            players.splice(index, 1);
            saveLocalData();
            populatePlayerSelects();
            renderPlayersList();
            showToast('选手已删除');
        }

        // 录入比赛表单提交
        document.getElementById('match-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const matchType = document.querySelector('input[name="match-type"]:checked').value;
            const matchDate = document.getElementById('match-date').value;
            const team1Score = parseInt(document.getElementById('team1-score').value);
            const team2Score = parseInt(document.getElementById('team2-score').value);

            const team1Player1Id = document.getElementById('team1-player1').value;
            const team2Player1Id = document.getElementById('team2-player1').value;

            const getPlayerName = (id) => players.find(p => p.id == id)?.name || '';

            let team1, team2;

            if (matchType === 'singles') {
                team1 = getPlayerName(team1Player1Id);
                team2 = getPlayerName(team2Player1Id);

                const player1 = players.find(p => p.id == team1Player1Id);
                const player2 = players.find(p => p.id == team2Player1Id);

                if (player1 && player2) {
                    const netWins = team1Score - team2Score;
                    player1.points += netWins;
                    player2.points -= netWins;

                    if (team1Score > team2Score) {
                        player1.wins++;
                        player2.losses++;
                    } else if (team1Score < team2Score) {
                        player1.losses++;
                        player2.wins++;
                    } else {
                        player1.draws++;
                        player2.draws++;
                    }
                }
            } else {
                const team1Player2Id = document.getElementById('team1-player2').value;
                const team2Player2Id = document.getElementById('team2-player2').value;

                team1 = `${getPlayerName(team1Player1Id)}/${getPlayerName(team1Player2Id)}`;
                team2 = `${getPlayerName(team2Player1Id)}/${getPlayerName(team2Player2Id)}`;

                const team1Players = [team1Player1Id, team1Player2Id].sort().join(',');
                const team2Players = [team2Player1Id, team2Player2Id].sort().join(',');

                let doublesTeam1 = doublesTeams.find(t => t.players.sort().join(',') === team1Players);
                let doublesTeam2 = doublesTeams.find(t => t.players.sort().join(',') === team2Players);

                if (!doublesTeam1) {
                    doublesTeam1 = {
                        id: doublesTeams.length + 1,
                        name: team1,
                        players: [parseInt(team1Player1Id), parseInt(team1Player2Id)],
                        points: 0,
                        wins: 0,
                        losses: 0,
                        draws: 0
                    };
                    doublesTeams.push(doublesTeam1);
                }
                if (!doublesTeam2) {
                    doublesTeam2 = {
                        id: doublesTeams.length + 1,
                        name: team2,
                        players: [parseInt(team2Player1Id), parseInt(team2Player2Id)],
                        points: 0,
                        wins: 0,
                        losses: 0,
                        draws: 0
                    };
                    doublesTeams.push(doublesTeam2);
                }

                const netWins = team1Score - team2Score;
                doublesTeam1.points += netWins;
                doublesTeam2.points -= netWins;

                if (team1Score > team2Score) {
                    doublesTeam1.wins++;
                    doublesTeam2.losses++;
                } else if (team1Score < team2Score) {
                    doublesTeam1.losses++;
                    doublesTeam2.wins++;
                } else {
                    doublesTeam1.draws++;
                    doublesTeam2.draws++;
                }
            }

            const newMatch = {
                id: matchHistory.length + 1,
                type: matchType,
                team1: team1,
                team2: team2,
                score: `${team1Score}:${team2Score}`,
                winner: team1Score > team2Score ? 'team1' : (team1Score < team2Score ? 'team2' : 'draw'),
                date: matchDate
            };

            matchHistory.unshift(newMatch);
            saveLocalData();

            showToast('比赛记录已保存！');
            renderMatchList();
            loadStats();

            // 重置表单
            e.target.reset();
            document.getElementById('match-date').value = new Date().toISOString().split('T')[0];
            toggleMatchType();
        });

        // 渲染比赛列表
        function renderMatchList() {

        // 删除比赛
        function deleteMatch(matchId) {
            if (!confirm('确定要删除这场比赛记录吗？')) return;

            const matchIndex = matchHistory.findIndex(m => m.id === matchId);
            if (matchIndex === -1) return;

            const match = matchHistory[matchIndex];
            const scores = match.score.split(':');
            const team1Score = parseInt(scores[0]);
            const team2Score = parseInt(scores[1]);

            if (match.type === 'singles') {
                const player1 = players.find(p => p.name === match.team1);
                const player2 = players.find(p => p.name === match.team2);
                if (player1 && player2) {
                    const netWins = team1Score - team2Score;
                    player1.points -= netWins;
                    player2.points += netWins;

                    if (match.winner === 'team1') {
                        player1.wins--;
                        player2.losses--;
                    } else if (match.winner === 'team2') {
                        player1.losses--;
                        player2.wins--;
                    } else if (match.winner === 'draw') {
                        player1.draws--;
                        player2.draws--;
                    }
                }
            } else {
                const team1Players = match.team1.split('/').sort();
                const team2Players = match.team2.split('/').sort();

                const doublesTeam1 = doublesTeams.find(t => {
                    const names = t.players.map(id => players.find(p => p.id === id)?.name).sort();
                    return names[0] === team1Players[0] && names[1] === team1Players[1];
                });
                const doublesTeam2 = doublesTeams.find(t => {
                    const names = t.players.map(id => players.find(p => p.id === id)?.name).sort();
                    return names[0] === team2Players[0] && names[1] === team2Players[1];
                });

                if (doublesTeam1 && doublesTeam2) {
                    const netWins = team1Score - team2Score;
                    doublesTeam1.points -= netWins;
                    doublesTeam2.points += netWins;

                    if (match.winner === 'team1') {
                        doublesTeam1.wins--;
                        doublesTeam2.losses--;
                    } else if (match.winner === 'team2') {
                        doublesTeam1.losses--;
                        doublesTeam2.wins--;
                    } else if (match.winner === 'draw') {
                        doublesTeam1.draws--;
                        doublesTeam2.draws--;
                    }
                }
            }

            matchHistory.splice(matchIndex, 1);
            saveLocalData();
            renderMatchList();
            loadStats();
            showToast('比赛已删除');
        }

        // 加载统计
        function loadStats() {
            document.getElementById('stat-players').textContent = players.length;
            document.getElementById('stat-doubles').textContent = doublesTeams.length;
            document.getElementById('stat-matches').textContent = matchHistory.length;

            let totalSize = 0;
            for (let key in localStorage) {
                if (key.startsWith('badminton_')) {
                    totalSize += localStorage[key].length * 2;
                }
            }
            document.getElementById('stat-storage').textContent = formatSize(totalSize);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // 保存 GitHub 配置
        function saveGithubConfig() {
            const token = document.getElementById('github-token').value.trim();
            const owner = document.getElementById('github-owner').value.trim();
            const repo = document.getElementById('github-repo').value.trim();
            const branch = document.getElementById('github-branch').value.trim();

            if (!token || !owner || !repo || !branch) {
                showToast('请填写完整的 GitHub 配置信息', 'error');
                return;
            }

            localStorage.setItem('github_token', token);
            localStorage.setItem('github_owner', owner);
            localStorage.setItem('github_repo', repo);
            localStorage.setItem('github_branch', branch);
            showToast('配置已保存');
        }

        // 同步数据到 GitHub
        async function syncToGithub() {
            const token = localStorage.getItem('github_token');
            const owner = localStorage.getItem('github_owner');
            const repo = localStorage.getItem('github_repo');
            const branch = localStorage.getItem('github_branch');

            if (!token || !owner || !repo || !branch) {
                showToast('请先配置 GitHub 信息', 'error');
                return;
            }

            // 确保数据已保存
            saveLocalData();

            const data = {
                players: players,
                doublesTeams: doublesTeams,
                matches: matchHistory,
                nextPlayerId: window.nextPlayerId || 5
            };

            try {
                showToast('正在获取最新文件...');

                // 1. 获取当前文件的 SHA
                const shaResponse = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/data.json?ref=${branch}`,
                    {
                        method: 'GET',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                let sha = null;
                if (shaResponse.ok) {
                    const shaData = await shaResponse.json();
                    sha = shaData.sha;
                    console.log('当前文件 SHA:', sha);
                } else if (shaResponse.status === 404) {
                    console.log('文件不存在，将创建新文件');
                } else {
                    throw new Error(`获取 SHA 失败：${shaResponse.status}`);
                }

                showToast('正在上传数据...');

                // 2. 更新/创建文件
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
                const updateData = {
                    message: 'update: 自动同步比赛数据 ' + new Date().toLocaleString('zh-CN'),
                    content: content,
                    branch: branch
                };
                if (sha) {
                    updateData.sha = sha;
                }

                const updateResponse = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/data.json`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updateData)
                    }
                );

                if (!updateResponse.ok) {
                    const errorData = await updateResponse.json();
                    throw new Error(errorData.message || '更新失败');
                }

                const result = await updateResponse.json();
                console.log('更新成功:', result);

                showToast('✅ 同步成功！数据已推送到 GitHub');

                // 显示访问链接
                setTimeout(() => {
                    alert(`同步成功！\n\n仓库：${owner}/${repo}\n分支：${branch}\n\nGitHub Pages 将在 1-2 分钟内自动更新`);
                }, 500);
            } catch (e) {
                showToast('同步失败：' + e.message, 'error');
                console.error('同步错误:', e);
            }
        }

        // 页面加载时加载 GitHub 配置
        window.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('github_token');
            const owner = localStorage.getItem('github_owner');
            const repo = localStorage.getItem('github_repo');
            const branch = localStorage.getItem('github_branch');
            if (token) document.getElementById('github-token').value = token;
            if (owner) document.getElementById('github-owner').value = owner;
            if (repo) document.getElementById('github-repo').value = repo;
            if (branch) document.getElementById('github-branch').value = branch;
        });

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 标签页切换
        document.querySelectorAll('.admin-nav button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const tab = this.dataset.tab;
                document.querySelectorAll('.admin-section').forEach(section => {
                    section.classList.add('hidden');
                });
                document.getElementById('tab-' + tab).classList.remove('hidden');
            });
        });

        // 页面加载时检查认证
        checkAuth();
    </script>
</body>
</html>
